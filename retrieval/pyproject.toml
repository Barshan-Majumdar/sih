[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-service"
version = "0.1.0"
description = "Lightweight Hybrid Candidate Retrieval service combining BM25, TF-IDF Vector Search, and RRF"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "google-genai>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.pyright]
include = ["src", "tests", "benchmark"]
extraPaths = [".", "../.."]
